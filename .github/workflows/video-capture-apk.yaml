name: Build Video Capture APK

on:
  push:
    branches: [codex/video-capture]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Apply video observer and Lark ad endpoint block to pinned mihomo
        run: |
          git -C core/src/foss/golang/clash apply "$GITHUB_WORKSPACE/video-capture-mihomo.patch"
          git -C core/src/foss/golang/clash apply "$GITHUB_WORKSPACE/block-lark-ad-plugin.patch"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'
      - name: Apply upstream Go patches
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do patch -p 1 < "$p"; done
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-video-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-video-go-
      - name: Update CA bundle
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates
          cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt
      - name: Build debug APKs
        run: ./gradlew --no-daemon app:assembleAlphaDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: clash-meta-video-capture-lark-block-apks
          path: app/build/outputs/apk/alpha/debug/*.apk
          if-no-files-found: error
